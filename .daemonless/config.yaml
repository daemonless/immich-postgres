icon: ':simple-postgresql:'

cit:
  mode: port
  port: 5432

build:
  architectures:
    - amd64
    - aarch64
  auto_version: true
  variants:
    - tag: "14-pkg"
      pkg_name: postgresql14-server
      args:
        PG_VERSION: "14"
      aliases: ["14", "latest"]
      default: true
    - tag: "18-pkg"
      pkg_name: postgresql18-server
      args:
        PG_VERSION: "18"
        VECTORCHORD_VERSION: "pkg"
      aliases: ["18"]
    # PG 14 is stuck on VectorChord 0.5.3: the pgsty/vchord fork supports
    # PostgreSQL 15-19 only.
    - tag: "19-pkg"
      pkg_name: postgresql19-server
      args:
        PG_VERSION: "19"
        VECTORCHORD_VERSION: "1.5.0"
        VECTORCHORD_REPO: "pgsty/vchord"
      aliases: ["19"]

# Component of the daemonless/immich stack -- not a standalone catalog app.
fjord:
  exclude: true

name: immich-postgres

x-daemonless:
  title: "Immich PostgreSQL"
  icon: ":simple-postgresql:"
  category: "Databases"
  description: "PostgreSQL with pgvector and vectorchord extensions required by Immich for vector similarity search. Defaults to PostgreSQL 14 (:latest), PostgreSQL 18 available as :18."
  upstream_url: "https://github.com/immich-app/immich"
  web_url: "https://immich.app/"
  freshports_url: "https://www.freshports.org/databases/postgresql14-server/"
  user: "postgres"
  mlock: false
  upstream_binary: true
  appjail:
    makejail:
      options:
        - "template: !ENV '${PWD}/immich-postgres.conf'"
  notes: |
    This image is part of the [Immich Stack](https://daemonless.io/images/immich).

    **PostgreSQL version:** `:18` uses PostgreSQL 18 with VectorChord and pgvector from
    FreeBSD packages (recommended for new installs). `:latest` and `:14` remain on
    PostgreSQL 14 so existing deployments never break on pull; upgrading an existing
    PostgreSQL 14 database to 18 requires a full `pg_dumpall` and restore.

    PostgreSQL needs System V shared memory, which a jail does not get by default.
    Create `immich-postgres.conf` alongside `appjail-director.yml`, the same as the
    Immich stack's `immich-postgres-template.conf` (`allow.sysvipc` alone does nothing
    on FreeBSD 15; the jail needs its own `sysv*: new` namespaces):

    ```
    exec.start: "/bin/sh /etc/rc"
    exec.stop: "/bin/sh /etc/rc.shutdown jail"
    sysvmsg: new
    sysvsem: new
    sysvshm: new
    mount.devfs
    persist
    ip4: inherit
    ip6: inherit
    ```

  docs:
    env:
      POSTGRES_USER: "Database superuser (default: postgres)"
      POSTGRES_PASSWORD: "Database password (default: postgres)"
      POSTGRES_DB: "Database name (default: immich)"
      POSTGRES_INITDB_ARGS: "Additional initdb arguments"
    volumes:
      /var/lib/postgresql/data: "Database data directory"
    ports:
      5432: "PostgreSQL Port"

services:
  immich-postgres:
    image: ghcr.io/daemonless/immich-postgres:latest
    container_name: immich-postgres
    restart: unless-stopped

    annotations:
      org.freebsd.jail.allow.sysvipc: "true"

    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=immich

    volumes:
      - /path/to/containers/immich/postgres:/var/lib/postgresql/data

    ports:
      - "5432:5432"
